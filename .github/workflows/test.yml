name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  JOBS: '2'
  LC_ALL: C.UTF-8

jobs:
  perl:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl bison \
            libpcre2-dev zlib1g-dev liblzma-dev libzstd-dev libbz2-dev
      - name: Check embedded, static and runtime-loadable Perl
        run: bash tests/perl-check.sh
      - name: Check the embedding wrapper under ASan and UBSan
        run: bash tests/bashperl-sanitize.sh out/bash-shell
      - name: Check Perl alongside the full builtin collection
        run: |
          ./build.sh --profile full --include bashperl --name full-perl
          python3 tests/bashperl.py out/bash-full-perl
          python3 tests/profile-smoke.py out/bash-full-perl
          bash tests/host-smoke.sh out/bash-full-perl out/bash-full-perl.loadables.list
      - name: Preserve build records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perl-logs
          path: |
            out/bash-perl*.log
            out/bash-perl*.manifest.*
            out/bash-full-perl.log
            out/bash-full-perl.manifest.*
            out/perl/*.log
            out/perl/*/bash-os-perl.json
            out/perl/*/bash-os-installation.json
          retention-days: 14

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install build tools and static OpenSSL and libffi
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl bison python3-cryptography \
            libpcre2-dev zlib1g-dev liblzma-dev libzstd-dev libbz2-dev libssl-dev libffi-dev
      - name: Check embedded and runtime-loadable Python, and its package
        run: bash tests/python-check.sh
      - name: Preserve build records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-logs
          path: |
            out/bash-python.log
            out/bash-python.manifest.*
            out/python/*.log
            out/python/*/bash-os-python.json
            out/python/*/bash-os-installation.json
          retention-days: 14

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install build tools and fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl bison python3-cryptography \
            libpcre2-dev zlib1g-dev liblzma-dev libzstd-dev libbz2-dev \
            busybox bsdextrautils bc ed sharutils zstd openssh-client bubblewrap
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build and check full, pure, static and runtime modules
        run: |
          python3 bench/catalog.py --check
          bash tests/run.sh | tee test.log
          python3 tests/input-lifetime.py out/bash
          python3 tests/input-lifetime.py out/bash-static
          python3 tests/profile-smoke.py out/bash
          python3 tests/profile-smoke.py out/bash-static
          python3 tests/profile-smoke.py out/bash-pure
      - name: Check root credential drops
        run: sudo -n env BASHOS_REQUIRE_ROOT_TRANSITIONS=1 python3 tests/final-smoke.py out/bash accounts
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-logs
          path: |
            test.log
            out/*.log
            out/*.manifest.*
          retention-days: 14

  profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile: [shell, core, device, server, desktop, custom]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl bison \
            libpcre2-dev zlib1g-dev liblzma-dev libzstd-dev libbz2-dev
      - name: Compile and verify exact inclusion
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python3 tests/profiles.py
          if [[ $PROFILE == custom ]]; then
            printf 'cut|Cut "fields" with \\ and | separators
          seq
          ' > selected.list
            ./build.sh --list selected.list --name custom
            [[ $(out/bash-custom -c 'PATH=; seq 3 | cut -b 1') == $'1\n2\n3' ]]
          else
            ./build.sh --profile "$PROFILE"
          fi
          python3 tests/profile-smoke.py "out/bash-$PROFILE"
      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: profile-${{ matrix.profile }}-logs
          path: |
            out/*.log
            out/*.manifest.*
            out/*.loadables.list
          retention-days: 14

  riscv:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: riscv64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-riscv64-linux-gnu cmake curl \
            bison bc qemu-user qemu-user-binfmt binfmt-support python3-cryptography openssh-client
          sudo update-binfmts --enable qemu-riscv64
      - name: Build pinned target libraries and a static full executable
        run: |
          ./build-deps.sh | tee dependencies.log
          ./build.sh --profile full --static --deps-prefix out/deps/riscv64-linux-gnu
      - name: Run the RISC-V executable
        run: bash tests/cross-smoke.sh out/riscv64-linux-gnu/bash-static | tee cross.log
      - name: Preserve cross build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: riscv-logs
          path: |
            dependencies.log
            cross.log
            out/riscv64-linux-gnu/*.log
            out/riscv64-linux-gnu/*.manifest.*
            out/deps/riscv64-linux-gnu/bash-os-dependencies.json
          retention-days: 14

  aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu cmake curl \
            bison bc qemu-user qemu-user-binfmt binfmt-support python3-cryptography openssh-client
          sudo update-binfmts --enable qemu-aarch64
      - name: Build pinned target libraries and a static full executable
        run: |
          ./build-deps.sh | tee dependencies.log
          ./build.sh --profile full --static --deps-prefix out/deps/aarch64-linux-gnu
      - name: Run the AArch64 executable
        run: QEMU_RISCV64=qemu-aarch64 bash tests/cross-smoke.sh out/aarch64-linux-gnu/bash-static | tee cross.log
      # Ubuntu 24.04 uses GCC 13. These independent answers also catch wrong
      # arithmetic when release builders use a different compiler (e.g. GCC 14).
      - name: Check P-256 arithmetic and independent protocol fixtures
        run: |
          "$CC" -O2 -fstack-protector-strong -D_FORTIFY_SOURCE=2 -static \
            tests/p256-m-check.c -o out/p256-m-check
          qemu-aarch64 out/p256-m-check | tee p256-unit.log
          BASH_OS_RUNNER=qemu-aarch64 python3 tests/p256-check.py \
            out/aarch64-linux-gnu/bash-static --report p256.json | tee p256.log
      - name: Preserve cross build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aarch64-logs
          path: |
            dependencies.log
            cross.log
            p256-unit.log
            p256.log
            p256.json
            out/aarch64-linux-gnu/*.log
            out/aarch64-linux-gnu/*.manifest.*
            out/deps/aarch64-linux-gnu/bash-os-dependencies.json
          retention-days: 14

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang curl bison
          ./build.sh --profile shell
      - name: Fuzz the parsers, packfiles and the index
        env:
          FUZZ_SECONDS: '60'
        run: bash tests/fuzz.sh
      - name: Preserve fuzzer logs and reproducing inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-results
          path: |
            out/fuzz/*.log
            out/fuzz/*-crash-*
            out/fuzz/*-oom-*
            out/fuzz/*-timeout-*
          retention-days: 14
